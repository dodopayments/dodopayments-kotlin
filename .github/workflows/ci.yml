name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

jobs:
  lint:
    timeout-minutes: 15
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 15
    name: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build SDK
        run: ./scripts/build

  jitpack-config:
    timeout-minutes: 5
    name: jitpack config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JitPack distributes this SDK. A code generation can remove these custom files. This check makes the removal visible.
      - name: Check the JitPack distribution files
        run: |-
          set -e
          test -f jitpack.yml || { echo "::error::jitpack.yml is missing"; exit 1; }
          test -f .github/workflows/publish-jitpack.yml || { echo "::error::publish-jitpack.yml is missing"; exit 1; }
          grep -q 'jitpackGroup' buildSrc/src/main/kotlin/dodo-payments.publish.gradle.kts || { echo "::error::the JitPack coordinates are missing in the publish plugin"; exit 1; }
          for f in .github/workflows/publish-*.yml; do [ "$f" = .github/workflows/publish-jitpack.yml ] || { echo "::error::$f is back. JitPack distributes the SDK, not Maven Central."; exit 1; }; done
          if grep -q 'publishToMavenCentral' buildSrc/src/main/kotlin/dodo-payments.publish.gradle.kts; then echo "::error::the publish plugin publishes to Maven Central again"; exit 1; fi
          grep -q 'https://jitpack.io/v/dodopayments/dodopayments-kotlin.svg' README.md || { echo "::error::the README has no JitPack badge"; exit 1; }
          if grep -q 'javadoc.io' README.md; then echo "::error::the README links to javadoc.io, which serves only Maven Central versions"; exit 1; fi
          grep -q 'com.github.dodopayments.dodopayments-kotlin' README.md || { echo "::error::the README has no JitPack install instructions"; exit 1; }
          if grep -q '<groupId>com.dodopayments.api</groupId>' README.md; then echo "::error::the README install instructions point to Maven Central"; exit 1; fi
